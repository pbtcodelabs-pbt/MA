<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3a30">
<title>میرا مکتبہ — ڈاؤن لوڈ</title>
<meta name="description" content="میرا مکتبہ — ڈیجیٹل لائبریری، ڈیجیٹل ڈائری اور مصروفیات۔ 3 دن فری استعمال کریں۔">
<meta property="og:title" content="میرا مکتبہ — ڈیجیٹل لائبریری، ڈیجیٹل ڈائری اور مصروفیات">
<meta property="og:description" content="ایپ انسٹال کریں، 3 دن فری استعمال کریں، اس کے بعد خریدنے کا فیصلہ کریں۔">
<meta property="og:image" content="https://pbtcodelabs-pbt.github.io/MA/promo/mera-maktaba.jpg">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"JNN";src:local("Jameel Noori Nastaleeq"),url("fonts/jnn-regular.woff") format("woff");font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"JNN","Noto Nastaliq Urdu",serif;color:#fff1c1;background:radial-gradient(120% 70% at 50% 25%,#1f6a54 0%,#14463a 45%,#0b2e26 100%) fixed,#0b2e26;
  display:grid;place-items:center;min-height:100svh;padding:24px 20px}
.w{width:100%;max-width:420px;display:grid;justify-items:center;gap:18px;text-align:center}
.logo{width:160px;height:auto;filter:drop-shadow(0 12px 18px rgba(0,0,0,.5))}
.dl{position:relative;width:100%;border:0;border-radius:22px;padding:16px 14px;cursor:pointer;color:#0b2e26;font:inherit;font-size:26px;line-height:1.8;
  display:flex;align-items:center;justify-content:center;gap:12px;
  background:linear-gradient(180deg,#fff6d5 0%,#f1d27a 30%,#c8962f 55%,#f5dc8f 75%,#a8741f 100%);box-shadow:0 0 0 3px #fff3c4,0 8px 0 #8a5f16,0 16px 24px rgba(0,0,0,.45)}
.dl svg{width:38px;height:38px;flex:none}
.dl:active{transform:translateY(5px);box-shadow:0 0 0 3px #fff3c4,0 2px 0 #8a5f16}
.dl[disabled]{opacity:.65}
.bar{width:100%;height:18px;border-radius:99px;background:rgba(0,0,0,.35);border:1.5px solid #e8c467;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f1d27a,#2fc765);transition:width .2s}
.pc{font:700 18px Arial,sans-serif;color:#fff1c1;min-height:1.4em}
.msg{font-size:19px;line-height:2;color:#fff1c1;min-height:1.9em}
.msg b{font-weight:400;color:#f1d27a}
.again{border:0;background:none;color:#f1d27a;text-decoration:underline;font:inherit;font-size:16px;cursor:pointer}
[hidden]{display:none !important}
/* ایک ٹچ میں انسٹال (کروم سے سیدھی ایپ، فائل کی ضرورت نہیں) */
.inst{background:linear-gradient(180deg,#3fe07a,#16a34a 55%,#0f7a36) !important;color:#fff !important;box-shadow:0 0 0 3px #d9ffe6,0 8px 0 #0b5e2a,0 16px 24px rgba(0,0,0,.45) !important;font-size:28px !important}
.inst:active{box-shadow:0 0 0 3px #d9ffe6,0 2px 0 #0b5e2a !important}
.inst svg{stroke:#fff}
.or{font-size:15px;color:#e9dcb8;opacity:.85}
.dl.alt{font-size:19px;padding:10px 12px;background:rgba(255,255,255,.12);color:#fff1c1;box-shadow:0 0 0 1.5px #e8c467}
.dl.alt svg{width:26px;height:26px;stroke:#f1d27a}
.steps{width:100%;text-align:right;background:rgba(0,0,0,.28);border:1.5px solid #e8c467;border-radius:18px;padding:10px 14px;font-size:18px;line-height:2.1}
.steps b{font-weight:400;color:#f1d27a}
.chrome{display:inline-block;margin-top:4px;padding:4px 16px;border-radius:99px;background:#f1d27a;color:#0b2e26;text-decoration:none}

/* MA1710SA121: پوری ایپ میں ہندسے صرف انگریزی Arial — فون میں Arial نہ ہو تو ساتھ رکھا ہوا Arial جیسا فونٹ (Liberation Sans) */
@font-face{font-family:"Digits";src:local("Arial"),local("ArialMT"),url("fonts/digits.woff2") format("woff2");unicode-range:U+0021-007E;font-display:swap}
@font-face{font-family:"Digits";font-weight:700;src:local("Arial Bold"),local("Arial-BoldMT"),url("fonts/digits-bold.woff2") format("woff2");unicode-range:U+0021-007E;font-display:swap}
@font-face{font-family:"JNN";src:url("fonts/digits.woff2") format("woff2");unicode-range:U+0030-0039;font-display:swap}
@font-face{font-family:"JNNK";src:url("fonts/digits.woff2") format("woff2");unicode-range:U+0030-0039;font-display:swap}
@font-face{font-family:"JNN Kasheeda";src:url("fonts/digits.woff2") format("woff2");unicode-range:U+0030-0039;font-display:swap}
@font-face{font-family:"JNNP";src:url("fonts/digits.woff2") format("woff2");unicode-range:U+0030-0039;font-display:swap}
@font-face{font-family:"MAF Nafees";src:url("fonts/digits.woff2") format("woff2");unicode-range:U+0030-0039;font-display:swap}
@font-face{font-family:"MAF Khawar";src:url("fonts/digits.woff2") format("woff2");unicode-range:U+0030-0039;font-display:swap}
@font-face{font-family:"MAF Akram";src:url("fonts/digits.woff2") format("woff2");unicode-range:U+0030-0039;font-display:swap}
@font-face{font-family:"MAF Almas";src:url("fonts/digits.woff2") format("woff2");unicode-range:U+0030-0039;font-display:swap}
@font-face{font-family:"MAF Alfars";src:url("fonts/digits.woff2") format("woff2");unicode-range:U+0030-0039;font-display:swap}
@font-face{font-family:"MAF Gandhara";src:url("fonts/digits.woff2") format("woff2");unicode-range:U+0030-0039;font-display:swap}
</style>
</head>
<body>
<main class="w">
  <img class="logo" src="icons/app-badge.png" alt="میرا مکتبہ" width="150">
  <button type="button" class="dl inst" id="inst">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M12 7v7M9 11l3 3 3-3"/></svg>
    <span>ایک ٹچ میں انسٹال کریں</span>
  </button>
  <p class="msg" id="imsg"></p>
  <div class="steps" id="isteps" hidden></div>
  <p class="or">— یا —</p>
  <button type="button" class="dl alt" id="dl">
    <svg viewBox="0 0 24 24" fill="none" stroke="#0b2e26" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M6.5 10l5.5 5.5 5.5-5.5"/><path d="M4 20h16"/></svg>
    <span>فائل (APK) ڈاؤن لوڈ کریں</span>
  </button>
  <div class="bar" id="bar" hidden><i id="fill"></i></div>
  <p class="pc" id="pc"></p>
  <p class="msg" id="msg"></p>
  <button type="button" class="again" id="again" hidden>فائل نہیں ملی؟ دوبارہ محفوظ کریں</button>
</main>
<script>
(function () {
  const URL_APK = 'app/mera-maktaba-v1-8.apk', NAME = 'mera-maktaba.apk';
  const dl = document.getElementById('dl'), bar = document.getElementById('bar'), fill = document.getElementById('fill'),
        pc = document.getElementById('pc'), msg = document.getElementById('msg'), again = document.getElementById('again');
  let blobUrl = '';
  const save = () => { const a = document.createElement('a'); a.href = blobUrl || URL_APK; a.download = NAME; document.body.appendChild(a); a.click(); a.remove(); };
  const done = () => {
    fill.style.width = '100%'; pc.textContent = '100%';
    msg.innerHTML = '✅ ڈاؤن لوڈ مکمل<br>اب اوپر یا نیچے آنے والی اطلاع میں <b>«کھولیں»</b> دبائیں، پھر <b>«انسٹال»</b> دبائیں۔<br>فون اجازت مانگے تو <b>«اجازت دیں»</b> دبا دیں۔';
    again.hidden = false; dl.disabled = false;
  };
  dl.addEventListener('click', async () => {
    dl.disabled = true; bar.hidden = false; fill.style.width = '0'; pc.textContent = '0%'; msg.textContent = 'ڈاؤن لوڈ ہو رہی ہے…';
    try {
      const res = await fetch(URL_APK, { cache: 'no-cache' }); if (!res.ok || !res.body) throw new Error('net');
      const total = Number(res.headers.get('content-length')) || 0, reader = res.body.getReader(), parts = []; let got = 0;
      for (;;) {
        const { done: d, value } = await reader.read(); if (d) break;
        parts.push(value); got += value.length;
        if (total) { const p = Math.min(99, Math.round(got * 100 / total)); fill.style.width = p + '%'; pc.textContent = p + '%'; }
        else pc.textContent = (got / 1048576).toFixed(1) + ' MB';
      }
      blobUrl = URL.createObjectURL(new Blob(parts, { type: 'application/vnd.android.package-archive' }));
      save(); done();
    } catch (e) {
      // پٹی نہ چل سکے تو سیدھا ڈاؤن لوڈ
      bar.hidden = true; pc.textContent = ''; save(); done();
    }
  });
  again.addEventListener('click', save);
})();
// ایک ٹچ انسٹال: کروم خود ایپ بنا کر ہوم اسکرین پر لگا دیتا ہے — نہ فائل، نہ Play Protect کی وارننگ
(function () {
  const btn = document.getElementById('inst'), im = document.getElementById('imsg'), st = document.getElementById('isteps');
  let ev = null;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); ev = e; im.textContent = ''; });
  window.addEventListener('appinstalled', () => { ev = null; st.hidden = true; im.innerHTML = '✅ ایپ انسٹال ہو گئی — فون کی ہوم اسکرین پر <b>«میرا مکتبہ»</b> دبا کر کھولیں'; });
  const ua = navigator.userAgent, android = /Android/i.test(ua);
  const inChrome = /Chrome\//.test(ua) && !/wv\)|; wv|FBAN|FBAV|Instagram|SamsungBrowser|EdgA|OPR|MiuiBrowser|UCBrowser/i.test(ua);
  const chromeLink = 'intent://' + location.host + location.pathname + '#Intent;scheme=https;package=com.android.chrome;end';
  if (window.matchMedia('(display-mode: standalone)').matches) im.innerHTML = '✅ ایپ پہلے سے انسٹال ہے';
  btn.addEventListener('click', async () => {
    if (ev) { ev.prompt(); const r = await ev.userChoice.catch(() => null); if (r && r.outcome === 'accepted') im.innerHTML = '⏳ انسٹال ہو رہی ہے… چند سیکنڈ میں ہوم اسکرین پر آ جائے گی'; ev = null; return; }
    st.hidden = false;
    if (android && !inChrome) st.innerHTML = 'یہ صفحہ <b>کروم</b> میں کھولیں، پھر یہی بٹن دوبارہ دبائیں:<br><a class="chrome" href="' + chromeLink + '">کروم میں کھولیں</a>';
    else st.innerHTML = '1) اوپر کونے میں تین نقطے <svg width="14" height="22" viewBox="0 0 6 22" style="vertical-align:-5px" aria-hidden="true"><circle cx="3" cy="4" r="2.4" fill="#f1d27a"/><circle cx="3" cy="11" r="2.4" fill="#f1d27a"/><circle cx="3" cy="18" r="2.4" fill="#f1d27a"/></svg> دبائیں<br>2) <b>«ایپ انسٹال کریں»</b> یا <b>«ہوم اسکرین پر شامل کریں»</b> دبائیں<br>3) <b>«انسٹال»</b> دبائیں — بس';
  });
})();
</script>
</body>
</html>
