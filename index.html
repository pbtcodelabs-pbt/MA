<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14463a">
<meta name="description" content="مکتبۃ العزیز — تفصیلی فہرستِ کتب، دارالعلوم ختمِ نبوت عارف والا">
<title>مکتبۃ العزیز</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/jnn-kasheeda-title.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="style.css?v=MA610TU014">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="masthead-in">
      <div class="mh-row">
        <img class="logo" src="icons/logo.svg" alt="مکتبۃ العزیز کا لوگو" width="44" height="44">
        <div class="mh-text">
          <h1 class="name">مکتبۃ العزیز</h1>
          <p class="sub">تفصیلی فہرستِ کتب · <span class="inst">دارالعلوم ختمِ نبوت، عارف والا</span></p>
        </div>
      </div>
      <div class="status">
        <span class="chip" id="netChip"><span class="dot"></span><span class="lbl" id="netLbl">آن لائن</span></span>
        <span class="chip" id="verChip">MA610TU014</span>
        <button class="chip chip-btn share-chip" id="btnShare" type="button"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>بھیجیں</button>
        <button class="chip chip-btn" id="btnBackup" type="button" aria-expanded="false" aria-controls="backupBox">بیک اپ</button>
      </div>
      <div class="backup-box" id="backupBox" hidden>
        <p>کتب کا ڈیٹا اسی فون کے براؤزر میں محفوظ ہوتا ہے۔ وقتاً فوقتاً بیک اپ فائل ڈاؤن لوڈ کر لیا کریں۔</p>
        <div class="actions">
          <button class="btn ghost small" id="btnExport" type="button">بیک اپ فائل ڈاؤن لوڈ کریں</button>
          <label class="btn ghost small" for="importFile">بیک اپ فائل سے واپس لائیں</label>
          <input id="importFile" type="file" accept="application/json,.json" hidden>
        </div>
      </div>
    </div>
  </header>

  <!-- تلاش: سب کتب میں -->
  <div class="gsearch" role="search">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="gq" type="search" placeholder="کتاب، مصنف، مکتبہ یا فن تلاش کریں…" aria-label="سب کتب میں تلاش" autocomplete="off">
    <button id="gqClear" type="button" aria-label="تلاش صاف کریں" hidden>✕</button>
  </div>

  <!-- کل موجود کتب اور کل قیمت -->
  <section class="summary" aria-label="خلاصہ">
    <div class="facts">
      <div class="fact"><b id="sumTitles">0</b><span>کل کتب</span></div>
      <div class="fact"><b id="sumParts">0</b><span>کل اجزاء</span></div>
    </div>
    <div class="actions">
      <span class="price-out" id="sumPrice" hidden></span>
      <button class="btn gold" id="btnSumPrice" type="button">تمام کتب کی کل قیمت</button>
    </div>
  </section>

  <div class="app">
    <nav class="bar" aria-label="فنون">
      <h2>فنون</h2>
      <ul id="bar"></ul>
    </nav>
    <main id="view"></main>
  </div>




</div>

<div class="toast" id="toast" role="status" hidden></div>

<!-- نیچے کی پٹی: پیچھے، ہوم، آگے -->
<nav class="dock" aria-label="صفحات میں آنا جانا">
  <button type="button" class="dock-btn" id="navBack" aria-label="پیچھے" title="پیچھے">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
  <button type="button" class="dock-home" id="navHome" aria-label="ہوم" title="ہوم">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h5v-5.5h3v5.5h5V10"/></svg>
  </button>
  <button type="button" class="dock-btn" id="navFwd" aria-label="آگے" title="آگے">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
  </button>
</nav>

<script src="app.js?v=MA610TU014"></script>
<script src="share.js?v=MA610TU014"></script>
<script>
// بیک اپ خانہ کھولنا/بند کرنا
document.getElementById('btnBackup').addEventListener('click', e => {
  const box = document.getElementById('backupBox'); box.hidden = !box.hidden;
  e.currentTarget.setAttribute('aria-expanded', String(!box.hidden));
});
// آن لائن / آف لائن نشان
(function () {
  const chip = document.getElementById('netChip'), lbl = document.getElementById('netLbl');
  const upd = () => { const on = navigator.onLine; chip.classList.toggle('off', !on); lbl.textContent = on ? 'آن لائن' : 'آف لائن'; };
  addEventListener('online', upd); addEventListener('offline', upd); upd();
})();
// آف لائن کے لیے سروس ورکر؛ نیا ورژن آئے تو ایک بار خود ریفریش
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(err => console.warn('SW registration failed:', err));
  });
}
</script>
</body>
</html>
