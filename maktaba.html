        <button class="chip chip-btn" id="btnLogout" type="button">🚪 لاگ آؤٹ</button>

          <div class="actions">
            <button class="btn drive-go" id="btnDriveBackup" type="button"><svg class="gd" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#0f9d58" d="M8 3h8l7 12h-8z"/><path fill="#4285f4" d="M1 15l4 7h14l-4-7z"/><path fill="#f4b400" d="M8 3L1 15l4 7 7-12z"/></svg><span>بیک اپ</span><svg class="arr" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>

          </div>

        <div class="actions">

          <button class="btn ghost small" id="btnShareFile" type="button"><svg class="shr" viewBox="0 0 24 24" width="1.1em" height="1.1em" style="vertical-align:-0.2em" aria-hidden="true"><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4" stroke="currentColor" stroke-width="2.2" fill="none"/><circle cx="18" cy="5" r="3.2" fill="currentColor"/><circle cx="6" cy="12" r="3.2" fill="currentColor"/><circle cx="18" cy="19" r="3.2" fill="currentColor"/></svg> فائل بھیجیں</button>

<script>
// بیک اپ خانہ کھولنا/بند کرنا
document.getElementById('btnBackup').addEventListener('click', e => {
  const box = document.getElementById('backupBox'); box.hidden = !box.hidden;
  e.currentTarget.setAttribute('aria-expanded', String(!box.hidden));
});
// سرپرست کا نام: چوڑائی مکتبے کے نام کے برابر
(function () {
  const fit = () => {
    const h = document.querySelector('.name'), n = document.getElementById('patronName'); if (!h || !n) return;
    const r = document.createRange(); r.selectNodeContents(h); const tw = r.getBoundingClientRect().width;
    n.style.fontSize = ''; const base = parseFloat(getComputedStyle(n).fontSize); const nw = n.getBoundingClientRect().width;
    if (tw && nw) n.style.fontSize = Math.min(base * tw / nw, 40) + 'px';
  };
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(fit);
  addEventListener('resize', fit); setTimeout(fit, 1500);
})();
// آن لائن / آف لائن نشان
(function () {
  const chip = document.getElementById('netChip'), lbl = document.getElementById('netLbl');
  const upd = () => { const on = navigator.onLine; chip.classList.toggle('off', !on); lbl.textContent = on ? 'آن لائن' : 'آف لائن'; };
  addEventListener('online', upd); addEventListener('offline', upd); upd();
})();
// آف لائن کے لیے سروس ورکر؛ نیا ورژن آئے تو ایک بار خود ریفریش
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(err => console.warn('SW registration failed:', err));
  });
}
</script>
<script src="update.js?v=MA1010SA086"></script>
